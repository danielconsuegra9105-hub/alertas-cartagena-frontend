<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
  <div class="container">
    <a class="navbar-brand" routerLink="/">🚨 ZonaSoS - Cartagena</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <!-- Mostrar login/registro solo si NO está autenticado -->
        <ng-container *ngIf="!authService.estaAutenticado()">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login">Iniciar Sesión</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/registro">Registrarse</a>
          </li>
        </ng-container>
        
        <!-- Mostrar cerrar sesión y rol si está autenticado -->
        <ng-container *ngIf="authService.estaAutenticado()">
          <li class="nav-item">
            <span class="nav-link text-warning">
              {{ authService.obtenerUsuarioActual()?.rol === 'OPERADOR' ? '👑 Admin' : '👤 Ciudadano' }}
            </span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm my-2" (click)="cerrarSesion()">Cerrar Sesión</button>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
